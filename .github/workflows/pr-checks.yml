name: PR Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Smoke Tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://ci-placeholder.supabase.co' || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'ci-placeholder-anon-key' || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name == 'pull_request' && 'ci-placeholder-service-role-key' || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_SUPABASE_REDIRECT: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4321/api/auth/callback' || secrets.PUBLIC_SUPABASE_REDIRECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Deno 2 for Netlify dev
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke